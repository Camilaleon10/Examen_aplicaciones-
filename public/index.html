<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEON Juegos León</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="icon" href="./favicon.png" />
  </head>

  <body
    style="
      min-height: 100vh;
      background: linear-gradient(135deg, #ffc0cb, #ffb6d9, #ffd6e8);
    "
  >
    <!--Header-->
    <header
      class="px-6 py-4 flex items-center justify-between bg-pink-300 bg-opacity-80 backdrop-blur-md border-b border-pink-500"
    >
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-black">
          LEON Juegos León
        </h1>
        <p class="text-sm text-black">Catálogo de videojuegos</p>
      </div>
      <span class="text-xs text-black font-semibold"
        >Juegos Disponibles</span
      >
    </header>

    <!-- Contenido -->
    <main class="p-6 max-w-6xl mx-auto">
      <!-- Barra de busqueda -->
      <section
        class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between"
      >
        <div class="flex items-center gap-2 w-full md:max-w-md">
          <input
            id="input-busqueda"
            type="text"
            placeholder="Buscar videojuego..."
            class="w-full rounded-lg border border-pink-400 bg-white text-black placeholder-pink-400 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400"
          />
          <button
            id="btn-buscar"
            class="px-4 py-2 bg-pink-400 text-black font-bold rounded-lg text-sm hover:bg-pink-500 transition"
          >
            Buscar
          </button>
        </div>

        <div class="flex gap-2">
          <!-- Filtro por tienda -->
          <select
            id="select-tienda"
            class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-400"
          >
            <option value="">Todas las tiendas</option>
            <option value="1">Steam</option>
            <option value="7">Epic Games</option>
            <option value="11">Humble Store</option>
          </select>

          <!-- Ordenamiento -->
          <select
            id="select-orden"
            class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-400"
          >
            <option value="">Ordenar por</option>
            <option value="precio-asc">Precio: menor a mayor</option>
            <option value="precio-desc">Precio: mayor a menor</option>
          </select>
        </div>
      </section>

      <!-- Grid de los videojuegos -->
      <section>
        <h2 class="text-lg font-semibold mb-4 text-black">
          Videojuegos destacados
        </h2>

        <!-- Estado de carga -->
        <div
          id="spinner"
          class="hidden flex items-center gap-2 text-black"
        >
          <div
            class="w-5 h-5 border-4 border-pink-400 border-t-transparent rounded-full animate-spin"
          ></div>
          <span>Cargando videojuegos...</span>
        </div>

        <!-- Estado de error-->
        <p id="estado-error" class="text-red-700 mb-3 hidden">
          ❌ Error al cargar videojuegos
        </p>

        <!-- Contenedor de tarjetas -->
        <div
          id="grid-videojuegos"
          class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
        ></div>

        <!-- Boton de ver mas -->
        <button
          id="btn-ver-mas"
          class="mt-6 mx-auto block px-4 py-2 bg-pink-400 text-black font-bold border border-pink-500 rounded-lg hover:bg-pink-500 hidden"
        >
          Ver más
        </button>
      </section>
    </main>

    <!-- Modal de detalle -->
    <div
      id="modal"
      class="fixed inset-0 bg-pink-300 bg-opacity-50 flex items-center justify-center hidden"
    >
      <div class="bg-white w-80 p-5 rounded-lg shadow-xl relative">
        <button
          id="modal-cerrar"
          class="absolute top-2 right-2 text-black hover:text-pink-600"
        >
          ✖
        </button>

        <img id="modal-img" class="w-full rounded-lg mb-3" />
        <h2 id="modal-titulo" class="text-xl font-bold text-black"></h2>
        <p id="modal-precio-normal" class="text-sm text-gray-600"></p>
        <p
          id="modal-precio-oferta"
          class="text-lg font-semibold text-green-600"
        ></p>

        <a
          id="modal-link"
          class="mt-3 block text-center bg-pink-400 text-black px-3 py-2 rounded-lg hover:bg-pink-500 font-bold"
          target="_blank"
        >
          Ir a la tienda
        </a>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
